const I={'Indoor AC':'Cools the bedroom, with its slotted air outlet facing the bed. As it removes humidity it produces condensate water, the “waste water” Aqua Cool reuses. The refrigerant lines and the drain connect to its back.','Refrigerant line (cutaway wall)':'Carries refrigerant between the indoor unit and the outdoor condenser so heat from the room is moved outside.','AC condensate to tank':'Gravity drain that carries the AC’s condensate water down to the collection tank.','Condenser fan':'Pulls outdoor air through the condenser coil to carry heat away.','Temp sensor':'Measures the coil temperature so the Arduino knows when extra cooling is needed.','Spray nozzles':'Spray a fine mist onto the coil. The water evaporates and absorbs heat, cooling the coil and the air passing over it.','Condenser coil':'Where the refrigerant gives off heat to the outside air. A cooler coil means the AC works less hard.','Water collection tank':'Stores the condensate from the AC until the pump needs it.','Water-level sensor':'Tells the Arduino how much water is in the tank so the pump never runs dry.','Pump':'Pushes water from the tank up to the spray nozzles when the relay switches it on.','Backup container':'Reserve water that feeds the pump when the main tank runs low.','Arduino Nano':'The brain of the system: reads both sensors and decides when to run the pump.','5V relay module':'Lets the Nano’s low-power signal switch the pump on and off.','Air pulled through coil and fan':'The fan draws outside air through the wet coil. Evaporating mist cools that air, so heat leaves the refrigerant more easily.'};
